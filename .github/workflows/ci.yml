# =============================================================================
# VCCad — CI: build, test, and publish the WebAssembly editor.
# Runs on every push to main and every pull request (trunk-based, §6).
# =============================================================================
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The runner image also ships a newer SDK and may point DOTNET_ROOT at it. If `dotnet` is not 8.0
      # the workload installs into that newer band, and restoring the net8 browser project then fails with
      # NETSDK1147 asking for wasm-tools-net8 - a confusing way to learn which SDK was used. global.json
      # pins the SDK; this says so out loud when the pin is not doing its job.
      - name: Check the toolchain is .NET 8
        run: |
          version="$(dotnet --version)"
          echo "dotnet --version: $version"
          case "$version" in
            8.*) ;;
            *) echo "::error::expected the .NET 8 SDK (global.json pins it) but dotnet is $version"; exit 1 ;;
          esac
      # wasm-tools is needed even to restore the browser project once
      # WasmBuildNative is enabled (Skia native linking).
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore VCCad.sln

      - name: Build
        # Note: no -warnaserror — the wasm SDK emits a benign NativeFileReference
        # info message unless wasm AOT is enabled (see VCCad.App.Browser).
        run: dotnet build VCCad.sln -c Release --no-restore

      - name: Unit + integration tests
        run: |
          dotnet test tests/VCCad.Geometry.Tests -c Release --no-build --no-restore
          dotnet test tests/VCCad.Core.Tests -c Release --no-build --no-restore
          dotnet test tests/VCCad.Pdf.Tests -c Release --no-build --no-restore
          dotnet test tests/VCCad.Api.Integration.Tests -c Release --no-build --no-restore
          dotnet test tests/VCCad.App.Tests -c Release --no-build --no-restore

      - name: Publish WebAssembly editor (smoke)
        run: dotnet publish src/VCCad.App.Browser -c Release -o artifacts/wasm

      - name: Verify wasm artifacts
        run: |
          test -f artifacts/wasm/wwwroot/_framework/dotnet.js
          test -f artifacts/wasm/wwwroot/index.html
          test -f artifacts/wasm/VCCad.App.Browser.dll
          echo "wasm bundle OK"

      - name: Upload wasm bundle
        uses: actions/upload-artifact@v4
        with:
          name: vccad-wasm
          path: artifacts/wasm/wwwroot

  # Cross-publishes the self-contained Windows and Linux desktop bundles from
  # the Linux runner (the desktop host is not wasm, so wasm-tools is not
  # needed) and asserts each launcher is the right binary format.
  desktop-publish:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-desktop-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      # Only tag builds have a version; branch/PR refs would not be a valid
      # version, so the tag argument stays empty there.
      - name: Publish desktop bundles (win-x64 + linux-x64)
        run: scripts/publish-desktop.sh "${{ github.ref_type == 'tag' && github.ref_name || '' }}"

      - name: Verify desktop artifacts
        run: |
          test -f artifacts/desktop/win-x64/VCCad.App.Desktop.exe
          test -x artifacts/desktop/linux-x64/VCCad.App.Desktop
          file artifacts/desktop/win-x64/VCCad.App.Desktop.exe | grep -q 'PE32'
          file artifacts/desktop/linux-x64/VCCad.App.Desktop | grep -q 'ELF'
          echo "desktop bundles OK"

      - name: Upload desktop bundles
        uses: actions/upload-artifact@v4
        with:
          name: vccad-desktop
          path: artifacts/desktop
