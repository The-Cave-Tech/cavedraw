# =============================================================================
# VCCad — CI: build, test, and publish the WebAssembly editor.
# Runs on every push to main and every pull request (trunk-based, §6).
# =============================================================================
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The runner image also ships other SDKs and may point DOTNET_ROOT at one. If `dotnet` is not the
      # pinned band the workload installs into the wrong one, and restoring the browser project then fails
      # with NETSDK1147 asking for the workload by band name - a confusing way to learn which SDK was used.
      # global.json pins the SDK; this says so out loud when the pin is not doing its job.
      - name: Check the toolchain is .NET 10
        run: |
          version="$(dotnet --version)"
          echo "dotnet --version: $version"
          case "$version" in
            10.*) ;;
            *) echo "::error::expected the .NET 10 SDK (global.json pins it) but dotnet is $version"; exit 1 ;;
          esac
      # wasm-tools is needed even to restore the browser project once
      # WasmBuildNative is enabled (Skia native linking).
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      # The text-export tests embed a URW base-35 face - "Nimbus Sans" and friends. Those faces are
      # located on the machine rather than shipped with this project, because their licence is not ours to
      # redistribute. The runner does not have them, so exporting text threw
      # KeyNotFoundException looking up the font it had been told to use. Installing them here is the
      # difference between a build that tests the exporter and one that tests the runner's font list.
      - name: Install the standard fonts the export tests embed
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-urw-base35
          test -d /usr/share/fonts/opentype/urw-base35
          echo "VCCAD_URW_FONTS=/usr/share/fonts/opentype/urw-base35" >> "$GITHUB_ENV"
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore VCCad.sln

      - name: Build
        # Note: no -warnaserror — the wasm SDK emits a benign NativeFileReference
        # info message unless wasm AOT is enabled (see VCCad.App.Browser).
        run: dotnet build VCCad.sln -c Release --no-restore

      - name: Unit + integration tests
        run: |
          dotnet test tests/VCCad.Geometry.Tests -c Release --no-build --no-restore
          dotnet test tests/VCCad.Core.Tests -c Release --no-build --no-restore
          dotnet test tests/VCCad.Pdf.Tests -c Release --no-build --no-restore
          dotnet test tests/VCCad.Api.Integration.Tests -c Release --no-build --no-restore
          dotnet test tests/VCCad.App.Tests -c Release --no-build --no-restore

      - name: Publish WebAssembly editor (smoke)
        run: dotnet publish src/VCCad.App.Browser -c Release -o artifacts/wasm

      - name: Verify wasm artifacts
        run: |
          # What the publish actually produced, printed **before** the assertions: a path change should
          # take one reading of this log to fix, rather than a round trip through a failing run to find out.
          # It has already earned its keep - the tree below is how the assertions were corrected.
          ls -R artifacts/wasm | head -40

          # The site entry point and the runtime.
          test -f artifacts/wasm/wwwroot/index.html
          find artifacts/wasm -name 'dotnet*.js' -print -quit | grep .

          # The application assembly, in `_framework` alongside the runtime.
          #
          # Two traps, both hit for real. The publish does not put the assembly at the publish root, so a path
          # guessed from the csproj name finds nothing. And matching `VCCad.App.Browser.*` alone is too loose:
          # `runtimeconfig.json` matches it, so the check passed while proving nothing about whether the app
          # itself was published - which is how it looked green when it was not. Match the assembly's shape as
          # well, accepting both extensions: `.wasm` on .NET 10, `.webcil` on .NET 8. One `find` with `-o`,
          # because only one of them will exist and two independent checks would fail on the other.
          app=$(find artifacts/wasm/wwwroot/_framework \
                  -name 'VCCad.App.Browser.*.wasm' -o -name 'VCCad.App.Browser.*.webcil' \
                  | head -1)
          test -n "$app"
          echo "app assembly: $app"
          echo "wasm bundle OK"

      - name: Upload wasm bundle
        uses: actions/upload-artifact@v4
        with:
          name: vccad-wasm
          path: artifacts/wasm/wwwroot

  # Cross-publishes the self-contained Windows and Linux desktop bundles from
  # the Linux runner (the desktop host is not wasm, so wasm-tools is not
  # needed) and asserts each launcher is the right binary format.
  desktop-publish:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The text-export tests embed a URW base-35 face - "Nimbus Sans" and friends. Those faces are
      # located on the machine rather than shipped with this project, because their licence is not ours to
      # redistribute. The runner does not have them, so exporting text threw
      # KeyNotFoundException looking up the font it had been told to use. Installing them here is the
      # difference between a build that tests the exporter and one that tests the runner's font list.
      - name: Install the standard fonts the export tests embed
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-urw-base35
          test -d /usr/share/fonts/opentype/urw-base35
          echo "VCCAD_URW_FONTS=/usr/share/fonts/opentype/urw-base35" >> "$GITHUB_ENV"
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-desktop-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      # Only tag builds have a version; branch/PR refs would not be a valid
      # version, so the tag argument stays empty there.
      - name: Publish desktop bundles (win-x64 + linux-x64)
        run: scripts/publish-desktop.sh "${{ github.ref_type == 'tag' && github.ref_name || '' }}"

      - name: Verify desktop artifacts
        run: |
          test -f artifacts/desktop/win-x64/VCCad.App.Desktop.exe
          test -x artifacts/desktop/linux-x64/VCCad.App.Desktop
          file artifacts/desktop/win-x64/VCCad.App.Desktop.exe | grep -q 'PE32'
          file artifacts/desktop/linux-x64/VCCad.App.Desktop | grep -q 'ELF'
          echo "desktop bundles OK"

      - name: Upload desktop bundles
        uses: actions/upload-artifact@v4
        with:
          name: vccad-desktop
          path: artifacts/desktop
