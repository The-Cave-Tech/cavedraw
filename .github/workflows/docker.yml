# =============================================================================
# VCCad — CD: build the docker image on a v* tag, then deploy to the docker
# host (user@host) over SSH. Registry push is optional; the example below
# loads the image directly on the host and restarts the container, which keeps
# the pipeline dependency-free.
#
# Required repository secrets:
#   DOCKER_HOST_SSH_KEY   — private key for the `cave` user
#   DOCKER_HOST_SSH_HOST  — <host>
#   DOCKER_HOST_SSH_USER  — cave
# =============================================================================
name: docker

on:
  push:
    tags: ['v*']

env:
  IMAGE: vccad
  TAG: ${{ github.ref_name }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (tests run inside the image)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: ${{ env.IMAGE }}:${{ env.TAG }}, ${{ env.IMAGE }}:latest
          outputs: type=docker

      - name: Install ssh key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DOCKER_HOST_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DOCKER_HOST_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Load image on docker host
        run: |
          docker save ${{ env.IMAGE }}:${{ env.TAG }} | \
            ssh -o StrictHostKeyChecking=no \
              ${{ secrets.DOCKER_HOST_SSH_USER }}@${{ secrets.DOCKER_HOST_SSH_HOST }} \
              "docker load"

      - name: Deploy container on docker host
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.DOCKER_HOST_SSH_USER }}@${{ secrets.DOCKER_HOST_SSH_HOST }} \
            "docker rm -f vccad 2>/dev/null || true; \
             docker run -d --name vccad --restart unless-stopped -p 8080:8080 \
               ${{ env.IMAGE }}:${{ env.TAG }}"

      - name: Smoke test on the host
        run: |
          sleep 5
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.DOCKER_HOST_SSH_USER }}@${{ secrets.DOCKER_HOST_SSH_HOST }} \
            "curl -fsS http://127.0.0.1:8080/api/v1/health"
