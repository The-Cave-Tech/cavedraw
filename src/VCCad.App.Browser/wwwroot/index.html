<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCCad — vector graphics editor</title>
    <link rel="stylesheet" href="./app.css" />
</head>

<body style="margin: 0; overflow: hidden">
    <div id="out" style="width: 100vw; height: 100vh">
        <div class="vccad-splash">Loading VCCad…</div>
    </div>
    <script type="module" src="./main.js"></script>
    <script>
        // Remove the full-screen splash as soon as the Avalonia canvas exists so
        // the (absolute-positioned) overlay never hides the running editor.
        (function () {
            var timer = setInterval(function () {
                if (document.querySelector('#out canvas')) {
                    var splash = document.querySelector('.vccad-splash');
                    if (splash) splash.remove();
                    clearInterval(timer);
                }
            }, 250);
        })();
    </script>
</body>

</html>
